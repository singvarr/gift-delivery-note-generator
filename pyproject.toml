[tool.black]
line-length = 100
target-version = ['py314']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | build
  | dist
  | Include
  | Lib
  | Scripts
)/
'''

[tool.mypy]
python_version = "3.14"

[[tool.mypy.overrides]]
module = "pymorphy3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "num2words.*"
ignore_missing_imports = true
